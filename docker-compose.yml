services:
  web:
    build: .
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      # e.g. https://fiesta.midominio.com (needed for forms behind https)
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      TIME_ZONE: ${TIME_ZONE:-America/Mexico_City}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - evently_data:/data # sqlite + uploaded photos
    expose:
      - "8000" # Coolify's proxy routes the domain to this port
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/fiesta.ics')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  evently_data:
